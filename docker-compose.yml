services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - "3001:3000"

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    depends_on:
      - api
    ports:
      - "3000:80"
